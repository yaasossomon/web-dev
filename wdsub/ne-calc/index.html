<!DOCTYPE html>
<html>
  <head>

<title>NE calculator</title>
    <link rel="stylesheet"href="ne-calc-styles.css>

    <body>
      
      <h1>NE Calculator</h1>
<div>
<p> This applet takes a two-player game in normal form  and computes pure- strategy Nash Equilibria using best response</p
  
</div>
  
  
  
  <div id="input-grp">
    <label for="pl-strats">Number of strats for player 1 </label>
    <input id="p1-strats" type="number" min="1" max="8" value="2">
   <br>
    <br>
        <label for="p2-strats">Number of strats for player 2 </label>
    <input id="p2-strats"type="number"min="1"max="8"value="2">
   <br>
    <br>
    <button onclick="enterMatrix()">Go</button>
    </div>
  <script>
    function enterMatrix(){
      //get input values to pass to the next page 
    let p1NumStrats=document.getElementById("p1-strats").value;
        let p2NumStrats=document.getElementById("p2-strats").value;
      // send user to the matrix page 
    navigation.navigate("matrix.html?p1NumStrats="+ p1NumStrats + "&p2NumStrats" + p2NumStrats);
    }
  </script>
</body>
  </head>
</html>
